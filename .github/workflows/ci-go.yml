name: CI Go

on:
  push:
    branches: [main]
  # No path filter on pull_request: this check is REQUIRED by branch protection,
  # so it must always report a status on every PR (a path-filtered required check
  # that never triggers leaves the PR stuck "pending" forever).
  pull_request:
    branches: [main]

# Deny-by-default at the top level. This uses `pull_request` (NOT
# `pull_request_target`), so PRs from forks run with a read-only GITHUB_TOKEN
# and no access to repo secrets — do not change that trigger.
permissions: {}

jobs:
  go:
    name: Go gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # First step: installs an egress monitor on the runner with
      # `egress-policy: block`, so only the hosts in `allowed-endpoints` below
      # are reachable. Keep that allowlist in sync with this job's tools — the
      # Go toolchain + module proxy + golangci-lint reach proxy.golang.org,
      # sum.golang.org, storage.googleapis.com, and GitHub release assets.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            golangci-lint.run:443
            cli.codecov.io:443
            ingest.codecov.io:443
            api.codecov.io:443
            codecov.io:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history (not a shallow clone): Codecov walks the commit graph to
          # resolve the parent/base SHA. With the default shallow fetch the CLI
          # reports an empty CC_PARENT_SHA and falls back to a stale base, which
          # surfaces as "Report is N commits behind head on main".
          fetch-depth: 0
          # Don't leave the auth token in .git/config where dependency code could read it.
          persist-credentials: false

      # Toolchain version comes from go.mod (single source of truth).
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: go
          fail_ci_if_error: false

      # Pinned (not "latest") so the linter set is reproducible. golangci-lint v2.
      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.11.4
