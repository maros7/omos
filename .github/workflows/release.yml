name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload artifacts
      id-token: write # OIDC for provenance / trusted publishing
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            goreleaser.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags
          persist-credentials: false

      # Toolchain version comes from go.mod (single source of truth).
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: false

      # GoReleaser runs from the repo root against root .goreleaser.yaml
      # (whose build main is ./plugins/gogate/cmd/gogate).
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the npm distribution: the root `gogate` launcher package plus one
      # `@gogate/<os>-<arch>` package per platform (binaries taken from the
      # GoReleaser archives left in dist/). Versions come from the pushed tag.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org" # required for npm Trusted Publishing (OIDC)

      # OIDC Trusted Publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish npm packages
        run: node plugins/gogate/npm/scripts/publish.mjs
        env:
          # The script defaults DIST_DIR to <npm>/../dist; npm/ is now nested, so
          # point it at the repo-root dist/ that GoReleaser produced.
          DIST_DIR: ${{ github.workspace }}/dist
          # GITHUB_REF_NAME is the tag (e.g. v1.2.3); the script strips the leading "v".
          # No NODE_AUTH_TOKEN: OIDC Trusted Publishing is used instead.
