name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # release-please-action v5 emits path-prefixed outputs for manifest
      # components, keyed by the package path in release-please-config.json.
      release_created: ${{ steps.release.outputs['plugins/tripwire--release_created'] }}
      tag_name: ${{ steps.release.outputs['plugins/tripwire--tag_name'] }}
      review_fixer_release_created: ${{ steps.release.outputs['plugins/review-fixer--release_created'] }}
      review_fixer_tag_name: ${{ steps.release.outputs['plugins/review-fixer--tag_name'] }}
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish tripwire to npm
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC for npm Trusted Publishing
      contents: read
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools (setup-node provisions Node 24).
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org" # required for npm Trusted Publishing (OIDC)

      # OIDC Trusted Publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish tripwire package
        run: npm publish --access public
        working-directory: plugins/tripwire
        # No NODE_AUTH_TOKEN: OIDC Trusted Publishing is used instead.

  publish-review-fixer:
    name: Publish review-fixer to npm
    needs: [release-please]
    if: needs.release-please.outputs.review_fixer_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC for npm Trusted Publishing
      contents: read
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools (setup-node provisions Node 24).
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.review_fixer_tag_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org" # required for npm Trusted Publishing (OIDC)

      # OIDC Trusted Publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish review-fixer package
        run: npm publish --access public
        working-directory: plugins/review-fixer
        # No NODE_AUTH_TOKEN: OIDC Trusted Publishing is used instead.
