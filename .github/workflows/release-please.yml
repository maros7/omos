name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # release-please-action v5 emits path-prefixed outputs for manifest
      # components, keyed by the package path in release-please-config.json.
      release_created: ${{ steps.release.outputs['plugins/tripwire--release_created'] }}
      tag_name: ${{ steps.release.outputs['plugins/tripwire--tag_name'] }}
      review_fixer_release_created: ${{ steps.release.outputs['plugins/review-fixer--release_created'] }}
      review_fixer_tag_name: ${{ steps.release.outputs['plugins/review-fixer--tag_name'] }}
      gogate_release_created: ${{ steps.release.outputs['plugins/gogate--release_created'] }}
      gogate_tag_name: ${{ steps.release.outputs['plugins/gogate--tag_name'] }}
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools.
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish tripwire to npm
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC for npm Trusted Publishing
      contents: read
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools (setup-node provisions Node 24).
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org" # required for npm Trusted Publishing (OIDC)

      # OIDC Trusted Publishing requires npm >= 11.5.1. Pinned (not @latest) for a
      # reproducible build — keep in sync with the other publish jobs.
      - name: Update npm
        run: npm install -g npm@11.17.0

      - name: Publish tripwire package
        run: npm publish --access public
        working-directory: plugins/tripwire
        # No NODE_AUTH_TOKEN: OIDC Trusted Publishing is used instead.

  publish-review-fixer:
    name: Publish review-fixer to npm
    needs: [release-please]
    if: needs.release-please.outputs.review_fixer_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC for npm Trusted Publishing
      contents: read
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools (setup-node provisions Node 24).
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.review_fixer_tag_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org" # required for npm Trusted Publishing (OIDC)

      # OIDC Trusted Publishing requires npm >= 11.5.1. Pinned (not @latest) for a
      # reproducible build — keep in sync with the other publish jobs.
      - name: Update npm
        run: npm install -g npm@11.17.0

      - name: Publish review-fixer package
        run: npm publish --access public
        working-directory: plugins/review-fixer
        # No NODE_AUTH_TOKEN: OIDC Trusted Publishing is used instead.

  publish-gogate:
    name: Publish gogate to npm
    needs: [release-please]
    if: needs.release-please.outputs.gogate_release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # OIDC for npm Trusted Publishing
      contents: write # upload binary assets to the release-please release
    steps:
      # Installs an egress monitor on the runner with `egress-policy: block`, so
      # only the hosts in `allowed-endpoints` below are reachable. Keep that
      # allowlist in sync with this job's tools (GoReleaser + Go toolchain +
      # setup-node provisions Node 24).
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            go.dev:443
            dl.google.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            goreleaser.com:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            token.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.gogate_tag_name }}
          fetch-depth: 0 # GoReleaser needs full history/tags
          persist-credentials: false

      # Toolchain version comes from go.mod (single source of truth).
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: false

      # release-please tags are component-prefixed (opencode-gogate-vX.Y.Z);
      # strip the prefix so GoReleaser sees a clean semver tag.
      - name: Compute GoReleaser tag
        run: echo "GORELEASER_CURRENT_TAG=v${TAG#opencode-gogate-v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ needs.release-please.outputs.gogate_tag_name }}

      # Build the gogate archives + checksums only. `--skip=publish` means
      # GoReleaser does NOT create/touch a GitHub release (release-please owns
      # it); `--skip=validate` avoids a dirty-tree/prefixed-tag-mismatch abort.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --skip=validate,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach the GoReleaser artifacts to the release-please GitHub Release.
      # `--clobber` keeps re-runs idempotent. Must run before npm publish.
      - name: Upload binary assets to the release
        run: gh release upload "$TAG" dist/gogate_*.tar.gz dist/gogate_*.zip dist/checksums.txt --clobber
        env:
          TAG: ${{ needs.release-please.outputs.gogate_tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org" # required for npm Trusted Publishing (OIDC)

      # OIDC Trusted Publishing requires npm >= 11.5.1. Pinned (not @latest) for a
      # reproducible build — keep in sync with the other publish jobs.
      - name: Update npm
        run: npm install -g npm@11.17.0

      - name: Publish gogate to npm
        run: npm publish --provenance --access public
        working-directory: plugins/gogate
        # No NODE_AUTH_TOKEN: OIDC Trusted Publishing is used instead.
