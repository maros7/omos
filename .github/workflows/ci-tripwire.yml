name: CI tripwire

on:
  push:
    branches: [main]
    paths:
      - "plugins/tripwire/**"
  # No path filter on pull_request: this check is REQUIRED by branch protection,
  # so it must always report a status on every PR. Push is still path-scoped.
  pull_request:
    branches: [main]

# Deny-by-default at the top level. Dependabot-authored PRs already run with a
# read-only GITHUB_TOKEN and no access to repo secrets because this uses
# `pull_request` (NOT `pull_request_target`) — do not change that trigger.
permissions: {}

jobs:
  test:
    name: TS plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Installs an egress firewall so a compromised dependency cannot phone
      # home / exfiltrate during install. The TS layer needs npm + GitHub + codecov.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            cli.codecov.io:443
            api.codecov.io:443
            ingest.codecov.io:443
            codecov.io:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov
        working-directory: plugins/tripwire

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: plugins/tripwire/coverage/lcov.info
          flags: tripwire
          fail_ci_if_error: false

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Must be the first step: installs an egress firewall on the runner so a
      # compromised dependency cannot phone home / exfiltrate during install.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the auth token in .git/config where dependency code could read it.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned (not "latest") so the toolchain itself is reproducible.
          bun-version: 1.3.14

      # In a bun workspace, install happens once at the repo root.
      # --frozen-lockfile: fail if bun.lock would change (lockfile + integrity hashes are the source of truth).
      # --ignore-scripts: block arbitrary install/postinstall code execution from dependencies.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck
        working-directory: plugins/tripwire

  lint:
    name: tripwire Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Must be the first step: installs an egress firewall on the runner so a
      # compromised dependency cannot phone home / exfiltrate during install.
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-sudo: true
          disable-file-monitoring: false
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Don't leave the auth token in .git/config where dependency code could read it.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned (not "latest") so the toolchain itself is reproducible.
          bun-version: 1.3.14

      # In a bun workspace, install happens once at the repo root.
      # --frozen-lockfile: fail if bun.lock would change (lockfile + integrity hashes are the source of truth).
      # --ignore-scripts: block arbitrary install/postinstall code execution from dependencies.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint
        working-directory: plugins/tripwire
