version: 2
project_name: omos

before:
  hooks:
    - go mod tidy

builds:
  - id: gogate
    main: ./plugins/gogate/cmd/gogate
    binary: gogate
    env:
      - CGO_ENABLED=0 # static binaries, no libc dependency
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: gogate
    ids: [gogate] # ship only the gogate binary in this archive
    formats: [tar.gz]
    # Keep the binary at the archive root; the plugin installer extracts straight
    # into <cache>/bin and expects the binary there (no wrapping subdirectory).
    wrap_in_directory: false
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "gogate_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: maros7
    name: omos
